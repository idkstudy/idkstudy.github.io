const state = { grade: 6, id: 'g6u5' };
const gradesEl = document.getElementById('grades');
const lessonsEl = document.getElementById('lessons');
const prevEl = document.getElementById('preview');
const dlEl = document.getElementById('dl');
const nameEl = document.getElementById('tname');
const GRADES = [3,4,5,6];
function arG(g){return {3:'الثالث',4:'الرابع',5:'الخامس',6:'السادس'}[g]}
function cur(){ return LESSONS.find(l=>l.id===state.id) || LESSONS.find(l=>l.grade===state.grade); }
function renderGrades(){
  gradesEl.innerHTML='';
  GRADES.forEach(g=>{
    const has = LESSONS.some(l=>l.grade===g);
    const d=document.createElement('div');
    d.className='chip'+(has?(g===state.grade?' on':''):' off');
    d.textContent='الصف '+arG(g)+(has?'':' — قريبًا');
    if(has) d.onclick=()=>{ state.grade=g; const f=LESSONS.find(l=>l.grade===g); state.id=f.id; render(); };
    gradesEl.appendChild(d);
  });
}
function renderLessons(){
  lessonsEl.innerHTML='';
  LESSONS.filter(l=>l.grade===state.grade).forEach(l=>{
    const d=document.createElement('div');
    d.className='card'+(l.id===state.id?' on':'');
    d.innerHTML='<div class="t">'+l.lesson+'</div><div class="s">الوحدة '+l.unit+' — ٤٥ دقيقة — النموذج الرسمي</div>';
    d.onclick=()=>{ state.id=l.id; render(); };
    lessonsEl.appendChild(d);
  });
}
function dots(n){ return '.'.repeat(n); }
function renderPreview(){
  const l=cur(); if(!l) return;
  const name=(nameEl.value||'').trim()||'IDKStudy';
  const objs=l.objectives.map((o,i)=>'<div style="margin-top:5px">'+(i+1)+'-&nbsp; '+o+'</div>').join('')
    +'<div style="margin-top:5px">4-&nbsp; <span class="dots">'+dots(52)+'</span></div>'
    +'<div style="margin-top:5px">5-&nbsp; <span class="dots">'+dots(52)+'</span></div>';
  const wu=(l.warmup&&l.warmup.steps||[]).map(s=>'• '+s).join('<br>');
  prevEl.innerHTML=
    '<div class="tn"><b>Teacher&#8217;s Name:</b> '+name+' <span class="dots">'+dots(24)+'</span></div>'
    +'<div class="row"><div><b>Grade:</b> '+l.grade+'</div><div><b>Unit:</b> '+l.unit+'</div><div style="flex:2"><b>lesson:</b> '+l.lesson+'</div><div><b>Date:</b> <span class="dots">'+dots(7)+'</span></div></div>'
    +'<div class="box"><b class="lab">General objective:</b><br>'+l.general+'</div>'
    +'<div class="box"><b class="lab">Learning objectives:</b><br>By the end of the lesson, pupils/ students will be able to:'+objs+'</div>'
    +'<div class="box"><b class="lab">Psychomotor objectives:</b><br>'+l.psychomotor+'</div>'
    +'<div class="box"><b class="lab">Affective objective:</b><br>'+l.affective+'</div>'
    +'<div class="box"><b class="lab">Materials:</b><br>'+l.materials+'</div>'
    +'<div class="box"><b class="lab">Skills:</b><br>'+l.skills+'</div>'
    +'<div class="box"><b class="lab">Warm up:</b> <b>The teacher will:</b> <span style="float:right">('+(l.warmup?l.warmup.minutes:4)+' minutes)</span><br>'+wu+'<br><b class="lab">Teaching method:</b> '+(l.warmup?l.warmup.method:'')+'</div>';
  dlEl.href='data:application/pdf;base64,'+l.pdf;
  dlEl.setAttribute('download','plan_g'+l.grade+'_u'+l.unit+'.pdf');
}
function render(){ renderGrades(); renderLessons(); renderPreview(); }
nameEl.addEventListener('input', renderPreview);
render();
</script>

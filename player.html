<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مشغّل الإصغاء</title>
<style>
@font-face{font-family:'Thmanyah';src:url('https://omrhmza.github.io/myschedulejson/assets/font.ttf') format('truetype');font-display:swap}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg1:#2b1607;--bg2:#170b02;--orange:#f07d1e;--orange2:#ff9a3d;
  --cream:#f6ead9;--cream70:rgba(246,234,217,.7);--cream45:rgba(246,234,217,.45);
  --card:rgba(255,255,255,.055);--line:rgba(246,234,217,.14);
}
html,body{min-height:100%}
html{background:#170b02}
body{
  font-family:'Thmanyah',serif;color:var(--cream);
  background:radial-gradient(120% 340px at 50% -60px,#4a2410 0%,transparent 70%),
             linear-gradient(180deg,var(--bg1),var(--bg2) 420px);
  background-color:#170b02;background-repeat:no-repeat;
  padding:26px 16px 40px;
}
.wrap{max-width:560px;margin:0 auto}
.kicker{color:var(--orange);font-size:12px;letter-spacing:.35em;text-align:center;font-weight:700}
h1{font-size:40px;font-weight:900;text-align:center;margin-top:8px;line-height:1.15}
.sub{text-align:center;color:var(--cream70);font-size:16px;margin-top:6px}
.rule{width:56px;height:3px;border-radius:3px;background:var(--orange);margin:16px auto 22px}
.track{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:16px;backdrop-filter:blur(4px)}
.thead{display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none}
.num{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:2px solid var(--orange);color:var(--orange);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900}
.titles{flex:1;min-width:0}
.tlabel{color:var(--orange);font-size:10.5px;letter-spacing:.28em;font-weight:700}
.ten{font-size:21px;font-weight:700;line-height:1.25;margin-top:2px}
.tar{color:var(--cream70);font-size:15px;margin-top:1px}
.playbtn{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:none;background:linear-gradient(180deg,var(--orange2),var(--orange));color:#2b1607;font-size:21px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(240,125,30,.35);cursor:pointer}
.playbtn:active{transform:scale(.94)}
.tmeta{color:var(--cream45);font-size:13px;margin-top:10px;display:flex;justify-content:space-between}
.body{display:none;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.track.open .body{display:block}
audio{width:100%;height:44px;margin-bottom:8px}
.seg{padding:11px 2px;border-bottom:1px dashed rgba(246,234,217,.12)}
.seg:last-child{border-bottom:none}
.en{direction:ltr;text-align:left;font-size:18.5px;line-height:1.45;color:var(--cream)}
.ar{direction:rtl;text-align:right;font-size:15.5px;line-height:1.7;color:var(--cream70);margin-top:3px}
.foot{text-align:center;color:var(--cream45);font-size:12.5px;margin-top:26px;letter-spacing:.12em}
.err{text-align:center;color:var(--cream70);padding:30px 0}
/* ===== خط زمن الدرس — 45 دقيقة ===== */
.lesson{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:18px}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lstage{font-size:25px;font-weight:900;line-height:1.2}
.lstage small{display:block;font-size:14px;color:var(--cream70);font-weight:400;margin-top:2px}
.ltime{text-align:left;color:var(--cream70);font-size:13.5px;line-height:1.7;white-space:nowrap}
.ltime b{color:var(--cream);font-size:16px}
.bar{display:flex;height:16px;border-radius:9px;overflow:hidden;margin:14px 0 8px;background:rgba(255,255,255,.07)}
.bar .seg{height:100%;border-inline-start:1px solid rgba(23,11,2,.55);position:relative}
.bar .seg:first-child{border-inline-start:none}
.bar .fillseg{position:absolute;top:0;bottom:0;inset-inline-start:0;background:linear-gradient(90deg,var(--orange),var(--orange2));transition:width .9s linear}
.barwrap{position:relative}
.pointer{position:absolute;top:-4px;width:3px;height:24px;background:var(--cream);border-radius:2px;box-shadow:0 0 8px rgba(246,234,217,.8);transition:inset-inline-start .9s linear}
.steps{margin-top:10px}
.step{display:flex;align-items:center;gap:10px;padding:6px 2px;color:var(--cream45);font-size:15.5px}
.step .dot{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--cream45);display:flex;align-items:center;justify-content:center;font-size:12.5px}
.step .mins{margin-inline-start:auto;font-size:13px;color:var(--cream45);white-space:nowrap}
.step.done{color:var(--cream70)}
.step.done .dot{border-color:var(--orange);background:var(--orange);color:#2b1607;font-weight:900}
.step.now{color:var(--cream);font-weight:700}
.step.now .dot{border-color:var(--orange);color:var(--orange);box-shadow:0 0 10px rgba(240,125,30,.55)}
.lbtns{display:flex;gap:10px;margin-top:14px}
.lbtn{flex:1;border:none;border-radius:16px;padding:13px;font-family:inherit;font-size:17px;font-weight:900;cursor:pointer}
.lbtn.start{background:linear-gradient(180deg,var(--orange2),var(--orange));color:#2b1607;box-shadow:0 6px 18px rgba(240,125,30,.35)}
.lbtn.end{background:transparent;color:var(--cream70);border:1px solid var(--line)}
.lbtn:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">TEACHER&nbsp;TOOL</div>
  <h1 id="ptitle">مشغّل الإصغاء</h1>
  <div class="sub" id="psub"></div>
  <div class="rule"></div>
  <div class="lesson" id="lessonCard">
    <div class="tlabel" style="color:var(--orange);font-size:10.5px;letter-spacing:.28em;font-weight:700">LESSON TIMELINE · 45 MIN</div>
    <div class="lrow" style="margin-top:8px">
      <div class="lstage" id="lStage">الدرس لم يبدأ<small>اضغط «ابدأ الدرس» عند دخولك الصف</small></div>
      <div class="ltime" id="lTime"></div>
    </div>
    <div class="barwrap">
      <div class="bar" id="lBar"></div>
      <div class="pointer" id="lPointer" style="inset-inline-start:0;display:none"></div>
    </div>
    <div class="steps" id="lSteps"></div>
    <div class="lbtns">
      <button class="lbtn start" id="lStart">▶ ابدأ الدرس</button>
      <button class="lbtn end" id="lEnd" style="display:none">إنهاء الدرس</button>
    </div>
  </div>
  <div id="list"></div>
  <div class="foot">أداة خاصة بالمعلّم · تُحدَّث عن بُعد</div>
</div>
<script type="application/json" id="fallback">{"subtitle":"الصف السادس — الوحدة الخامسة","title":"مشغّل الإصغاء","tracks":[{"audio":"https://idkstudy.github.io/audio/g6_u5_ex1_tv_guide_slow.mp3","duration":"0:38","id":"g6u5-ex1","label":"EXERCISE 1 · LISTENING","meta":"كتاب الطالب · ص ٢٤ · النسخة البطيئة","no":1,"segments":[{"ar":"أطفالنا الأعزّاء، شاهدوا برنامجكم المفضّل على القناة الأولى في الساعة الرابعة مساءً.","en":"Our dear children, watch your favourite programme on channel 1 at 4 pm."},{"ar":"إذا كنتم تحبّون الإجابة عن الأسئلة والفوز بالجوائز، فشاهدونا على القناة الثانية في الساعة السابعة مساءً.","en":"If you like to answer questions and win prizes, watch us on channel 2 at 7 pm."},{"ar":"ولمعرفة ما يحدث في العالم، يمكنكم مشاهدتنا في الساعة الثامنة مساءً.","en":"And to know what's happening in the world, you can watch us at 8 pm."},{"ar":"وللاستمتاع ببرنامج عن الطبيعة، انضمّوا إلينا في الساعة التاسعة مساءً.","en":"To enjoy a programme about nature, join us at 9 pm."},{"ar":"ولمشاهدة مباراة كرة سلّة مباشرة، انضمّوا إلينا في الساعة العاشرة مساءً.","en":"And for a live basketball match, join us at 10 pm."},{"ar":"أمّا الآن، فأنتم تشاهدون فيلمًا لمستر بين.","en":"For now, you're watching a Mr Bean film."}],"title_ar":"دليل البرامج التلفزيونية","title_en":"The TV Guide"},{"audio":"https://idkstudy.github.io/audio/g6_u5_ex2_paul_slow.mp3","duration":"0:28","id":"g6u5-ex2","label":"EXERCISE 2 · LISTENING","meta":"كتاب الطالب · ص ٢٤ · النسخة البطيئة","no":2,"segments":[{"ar":"مرحبًا، اسمي بول، وأحبّ مشاهدة البرامج الرياضية.","en":"Hi, my name's Paul and I like watching sports programmes."},{"ar":"أختي ساندي تعشق أفلام ديزني.","en":"My sister Sandy loves Disney films."},{"ar":"أمّي تحبّ برامج المسابقات.","en":"My mother likes quiz shows."},{"ar":"أبي لا يشاهد إلا الأخبار.","en":"My father only watches the news."},{"ar":"أخي كين يعشق مشاهدة الأفلام الوثائقية.","en":"My brother, Ken, loves watching documentaries."},{"ar":"لكنّنا في هذه اللحظة جميعًا نشاهد مسلسلنا التلفزيوني المفضّل.","en":"But at the moment we're all watching our favourite TV series."}],"title_ar":"بول وعائلته","title_en":"Paul and His Family"},{"audio":"https://idkstudy.github.io/audio/g6_u5_pronunciation_slow.mp3","duration":"0:11","id":"g6u5-pron","label":"PRONUNCIATION","meta":"شريط النطق · النسخة البطيئة","no":3,"segments":[{"ar":"هذه الكلمات مكوَّنة من مقطعين صوتيّين.","en":"These words are of two syllables."},{"ar":"مفتوح / يفتح","en":"Open — o·pen"},{"ar":"نيسان (الشهر الرابع)","en":"April — A·pril"},{"ar":"طفل صغير","en":"Baby — ba·by"},{"ar":"نمر","en":"Tiger — ti·ger"}],"title_ar":"كلمات من مقطعين صوتيين","title_en":"Two-Syllable Words"}],"version":1}</script>
<script>
const listEl=document.getElementById('list');
function render(data){
  document.getElementById('ptitle').textContent=data.title||'مشغّل الإصغاء';
  document.getElementById('psub').textContent=data.subtitle||'';
  listEl.innerHTML='';
  data.tracks.forEach(tr=>{
    const card=document.createElement('div');card.className='track';
    const segs=tr.segments.map(s=>`<div class="seg"><div class="en">${s.en}</div><div class="ar">${s.ar}</div></div>`).join('');
    card.innerHTML=`
      <div class="thead">
        <div class="num">${tr.no}</div>
        <div class="titles">
          <div class="tlabel">${tr.label}</div>
          <div class="ten" dir="ltr" style="text-align:right">${tr.title_en}</div>
          <div class="tar">${tr.title_ar}</div>
        </div>
        <button class="playbtn" aria-label="تشغيل">▶</button>
      </div>
      <div class="tmeta"><span>${tr.meta}</span><span dir="ltr">${tr.duration}</span></div>
      <div class="body">
        <audio controls preload="none" src="${tr.audio}"></audio>
        ${segs}
      </div>`;
    const audio=card.querySelector('audio');
    const btn=card.querySelector('.playbtn');
    const head=card.querySelector('.thead');
    head.addEventListener('click',e=>{
      const open=card.classList.contains('open');
      document.querySelectorAll('.track.open').forEach(c=>{if(c!==card){c.classList.remove('open');const a=c.querySelector('audio');a.pause();c.querySelector('.playbtn').textContent='▶';}});
      card.classList.toggle('open',!open);
      if(!open){audio.play().catch(()=>{});}else{audio.pause();}
    });
    audio.addEventListener('play',()=>btn.textContent='⏸');
    audio.addEventListener('pause',()=>btn.textContent='▶');
    audio.addEventListener('ended',()=>btn.textContent='▶');
    listEl.appendChild(card);
  });
}
let fallback={};
try{fallback=JSON.parse(document.getElementById('fallback').textContent);}catch(e){}
render(fallback);
window.applyNewTracks=function(d){try{if(typeof d==='string')d=JSON.parse(d);if(d&&d.tracks&&d.tracks.length)render(d);}catch(e){}};
try{if(window.AndroidPlayer){const t=AndroidPlayer.getTracks();if(t){const d=JSON.parse(t);if(d&&d.tracks&&d.tracks.length)render(d);}}}catch(e){}
fetch('tracks.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const playing=[...document.querySelectorAll('audio')].some(a=>!a.paused);if(d&&d.tracks&&d.tracks.length&&!playing)render(d);}).catch(()=>{});
</script>
<script>
/* ===== خط زمن الدرس: 45 دقيقة، يبدأ بزر ويُحفظ وقت البدء في localStorage ===== */
const STAGES=[
 {en:'Warm-up',min:4},
 {en:'Activity 1',min:9},
 {en:'Formative Assessment',min:3},
 {en:'Activity 2',min:9},
 {en:'Formative Assessment',min:3},
 {en:'Activity 3',min:6},
 {en:'Formative Assessment',min:3},
 {en:'Final Assessment',min:5},
 {en:'Closure',min:3}
];
const TOTAL_S=45*60, KEY='lesson_start_ts';
const barEl=document.getElementById('lBar'), stepsEl=document.getElementById('lSteps'),
      stageEl=document.getElementById('lStage'), timeEl=document.getElementById('lTime'),
      ptrEl=document.getElementById('lPointer'),
      startBtn=document.getElementById('lStart'), endBtn=document.getElementById('lEnd');
barEl.innerHTML=STAGES.map(s=>`<div class="seg" style="flex-grow:${s.min}"><div class="fillseg" style="width:0%"></div></div>`).join('');
stepsEl.innerHTML=STAGES.map((s,i)=>`<div class="step" data-i="${i}"><div class="dot">${i+1}</div><div dir="ltr" style="text-align:right">${s.en}</div><div class="mins">${s.min} min</div></div>`).join('');
const bounds=[];{let acc=0;STAGES.forEach(s=>{bounds.push([acc,acc+s.min*60]);acc+=s.min*60;});}
function fmtClock(ts){const d=new Date(ts);let h=d.getHours();const m=String(d.getMinutes()).padStart(2,'0');const ap=h<12?'صباحًا':'مساءً';h=h%12;if(h===0)h=12;return h+':'+m+' '+ap;}
function fmtDur(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function tick(){
  const raw=localStorage.getItem(KEY);
  const fills=barEl.querySelectorAll('.fillseg'), steps=stepsEl.querySelectorAll('.step');
  if(!raw){
    stageEl.innerHTML='الدرس لم يبدأ<small>اضغط «ابدأ الدرس» عند دخولك الصف</small>';
    timeEl.innerHTML='';ptrEl.style.display='none';
    fills.forEach(f=>f.style.width='0%');steps.forEach(s=>s.className='step');
    startBtn.style.display='';endBtn.style.display='none';return;
  }
  const startTs=parseInt(raw,10);
  const elapsed=Math.min(Math.max((Date.now()-startTs)/1000,0),TOTAL_S);
  const over=elapsed>=TOTAL_S;
  let cur=STAGES.length-1;
  for(let i=0;i<bounds.length;i++){if(elapsed<bounds[i][1]){cur=i;break;}}
  if(over){stageEl.innerHTML='انتهى الدرس<small>٤٥ دقيقة كاملة — اضغط «إنهاء الدرس» للتصفير</small>';}
  else{stageEl.innerHTML='<span dir="ltr">'+STAGES[cur].en+'</span><small>Stage '+(cur+1)+' of '+STAGES.length+'</small>';}
  timeEl.innerHTML='بدأ <b>'+fmtClock(startTs)+'</b><br>مرّ <b>'+fmtDur(elapsed)+'</b><br>باقي <b>'+fmtDur(TOTAL_S-elapsed)+'</b>';
  fills.forEach((f,i)=>{const[a,b]=bounds[i];const p=elapsed<=a?0:elapsed>=b?100:(elapsed-a)/(b-a)*100;f.style.width=p+'%';});
  steps.forEach((s,i)=>{s.className='step'+(over||i<cur?' done':i===cur?' now':'');if(over||i<cur)s.querySelector('.dot').textContent='✓';else s.querySelector('.dot').textContent=i+1;});
  ptrEl.style.display='';ptrEl.style.insetInlineStart='calc('+(elapsed/TOTAL_S*100)+'% - 1px)';
  startBtn.style.display='none';endBtn.style.display='';
}
startBtn.addEventListener('click',()=>{localStorage.setItem(KEY,String(Date.now()));tick();});
endBtn.addEventListener('click',()=>{localStorage.removeItem(KEY);tick();});
setInterval(tick,1000);tick();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDKStudy</title>
<style>
  @font-face {
    font-family: "AppFont";
    src: url("https://omrhmza.github.io/myschedulejson/assets/font.ttf") format("truetype");
    font-weight: 100 900;
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    font-family: "AppFont", Georgia, serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #2b1607 0%, #170b02 72%) fixed;
    color: #f6ead9;
    display: flex; align-items: center; justify-content: center;
    padding: 34px 18px;
  }
  .wrap { width: 100%; max-width: 480px; animation: rise .7s cubic-bezier(.32,.72,0,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .seal {
    text-align: center; font-size: 110px; font-weight: 900; line-height: 1.15;
    text-shadow: 0 10px 34px rgba(240,125,30,.25);
  }
  h1 { text-align: center; font-size: 38px; font-weight: 900; letter-spacing: .5px; line-height: 1.3; }
  .rule { width: 54px; height: 1px; background: rgba(240,125,30,.5); margin: 22px auto 26px; }

  .card {
    display: flex; gap: 14px; align-items: center;
    background: rgba(59,32,12,.42);
    border: 1px solid rgba(240,125,30,.28); border-radius: 22px;
    padding: 17px 18px; margin-bottom: 12px;
    box-shadow: inset 0 1px 0 rgba(246,234,217,.06), 0 10px 26px rgba(0,0,0,.25);
  }
  .ic {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    border: 1px solid rgba(240,125,30,.4); background: rgba(240,125,30,.1);
  }
  .card h2 { font-size: 18.5px; font-weight: 800; }
  .chip {
    flex: 0 0 auto; margin-inline-start: auto;
    font-size: 10.5px; font-weight: 700; letter-spacing: 2px; color: #ffb066;
    border: 1px solid rgba(240,125,30,.5); border-radius: 999px; padding: 5px 11px;
    background: rgba(23,11,2,.35); white-space: nowrap;
  }
  .chip.live { color: #170b02; background: #f07d1e; border-color: #f07d1e; }

  footer {
    text-align: center; margin-top: 28px;
    font-size: 12px; letter-spacing: 3px; color: #a98a63; font-weight: 700;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="seal">؟</div>
    <h1>IDKStudy</h1>
    <div class="rule"></div>

    <article class="card">
      <div class="ic">📚</div>
      <h2>كتب وخطط دراسية</h2>
      <span class="chip">قريبًا</span>
    </article>

    <article class="card">
      <div class="ic">📝</div>
      <h2>ملخصات ومواضيع جاهزة</h2>
      <span class="chip">قريبًا</span>
    </article>

    <article class="card">
      <div class="ic">🕐</div>
      <h2>تطبيق وقت المعهد</h2>
      <span class="chip live">متوفر</span>
    </article>

    <footer>¿IDKStudy?</footer>
  </div>
</body>
</html>
